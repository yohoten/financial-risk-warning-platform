name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: 运行测试
        run: python -m pytest -q

  data-gate:
    name: 数据就绪门禁（有数据时）
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装最小依赖
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyyaml pyarrow
      - name: 检出数据后执行 G0–G5
        run: |
          if [ ! -f data/raw/csmar_financial.csv ]; then
            echo "::notice::仓库未包含契约数据（.gitignore 排除），跳过就绪门禁"
            exit 0
          fi
          python -m scripts.check_data_readiness --quiet
