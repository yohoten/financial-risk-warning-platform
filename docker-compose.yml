  #   entrypoint: ["/app/docker/entrypoint.sh"]
  #   command: ["streamlit", "run", "streamlit_app/streamlit_app.py",
  #             "--server.port=8501", "--server.address=0.0.0.0", "--server.headless=true"]
  #   ports:
