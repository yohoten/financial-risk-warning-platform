services:
  risk-warning-platform:
    build:
      context: .
      dockerfile: Dockerfile
    image: risk-warning-platform:1.0
    container_name: risk-warning-platform
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./models/artifacts:/app/models/artifacts
      - ./cache:/app/cache
      - ./reports:/app/reports
    environment:
      - TZ=Asia/Shanghai
      - LOG_LEVEL=INFO
      - DEMO_MODE=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
