# 财务风险智能预警平台 · 生产反代（nginx）
# FastAPI 同时托管 SPA（web/dist）与扁平 API，本配置只做 TLS 终止 + 安全头 + 限流兜底。
# 认证与权限仍由 FastAPI 侧（api/auth、api/middleware）负责，nginx 不重复鉴权。

upstream api_upstream {
    server api:8000;
    keepalive 32;
}

# ---- 80 端口：直接反代（本地/内网演示即开即用）----
# 生产启用 HTTPS 时，可保留本块做 301 跳转，并启用下方 443 块。
server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 20m;

    # 登录接口限流兜底（每 IP 10 次/分钟）
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

    # SSE 长连接（事件流 / 对话流）：关缓冲、延长读超时
    location ~ ^/(events/stream|chat/stream)$ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/login {
        limit_req zone=login burst=20 nodelay;
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

