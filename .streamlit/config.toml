[theme]
primaryColor = "#2563eb"
backgroundColor = "#0b1220"
secondaryBackgroundColor = "#131d33"
textColor = "#e2e8f0"
font = "sans serif"

[server]
port = 8501
headless = true
maxUploadSize = 200
enableXsrfProtection = true
enableCORS = true

[browser]
gatherUsageStats = false

[client]
showErrorDetails = true
toolbarMode = "minimal"
